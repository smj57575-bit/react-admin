<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <!-- 데모 배너 1 — 보라 그라데이션 + 둥근 도형 (글자는 배너 제목으로 따로 올라간다) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1F5C"/>
      <stop offset="1" stop-color="#6D5AE6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B9A8FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#B9A8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <circle cx="1240" cy="260" r="340" fill="url(#glow)"/>
  <circle cx="1320" cy="420" r="150" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="1020" y="120" width="260" height="260" rx="56" fill="#FFFFFF" fill-opacity="0.12" transform="rotate(18 1150 250)"/>
  <circle cx="1460" cy="140" r="36" fill="#FFE8A3" fill-opacity="0.85"/>
</svg>
